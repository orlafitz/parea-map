<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PAREA European Psychedelic Research Map</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root {
      --trial: #2563a8;
      --framework: #2d7a3a;
      --org: #9b3060;
      --data: #6b3fa0;
      --nodata: #d4d0ca;
      --land: #ebe8e3;
      --sea: #f4f6f8;
      --line: #e8e4df;
      --muted: #777;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #f8f7f4;
      color: #1a1a1a;
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
    }

    header {
      padding: 12px 16px;
      background: #fff;
      border-bottom: 1px solid var(--line);
      text-align: center;
    }

    header h1 {
      font-size: 20px;
      font-weight: 700;
      line-height: 1.25;
      color: #2e1650;
      letter-spacing: -0.01em;
    }

    /* Filter + key box on the map */
    #controls {
      position: absolute;
      bottom: 24px;
      left: 12px;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 6px;
      background: rgba(255, 255, 255, 0.95);
      border-radius: 8px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    .box-body { display: flex; flex-direction: column; align-items: stretch; gap: 6px; }
    #controls.collapsed { padding: 6px 10px; }
    #controls.collapsed .box-body { display: none; }

    /* Header row: doubles as the collapse / expand button */
    .box-toggle {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      background: none;
      border: none;
      padding: 2px 0;
      cursor: pointer;
      font-family: inherit;
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #888;
    }

    .box-toggle:hover { color: #2e1650; }
    .box-toggle .label { flex: 1; text-align: left; }

    /* Small dots showing which filters are on, visible only when collapsed */
    .box-toggle .dots { display: none; gap: 4px; }
    #controls.collapsed .box-toggle .dots { display: flex; }
    .box-toggle .dots i { width: 8px; height: 8px; border-radius: 50%; display: block; }
    .box-toggle .dots i.off { opacity: 0.2; }

    .box-toggle .chev {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #f3f1ee;
      display: grid;
      place-items: center;
      transition: transform 0.2s ease;
    }

    #controls.collapsed .box-toggle .chev { transform: rotate(180deg); }

    .mini-key {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      font-size: 11px;
      color: #666;
      margin-top: 3px;
      padding-top: 7px;
      border-top: 1px solid #f0ede8;
    }

    .mini-key span { display: flex; align-items: center; gap: 5px; }
    .mini-key i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }

    .toggle-btn {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 5px 12px;
      border-radius: 20px;
      border: 1.5px solid var(--c);
      color: var(--c);
      font-size: 12.5px;
      font-weight: 500;
      cursor: pointer;
      background: transparent;
      transition: all 0.15s ease;
      font-family: inherit;
    }

    .toggle-btn .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--c); flex-shrink: 0; }
    .toggle-btn.active { background: var(--c); color: #fff; }
    .toggle-btn.active .dot { background: #fff; }
    .toggle-btn[data-cat="Clinical Trial"] { --c: var(--trial); }
    .toggle-btn[data-cat="Access Framework"] { --c: var(--framework); }
    .toggle-btn[data-cat="Organisation"] { --c: var(--org); }

    #stage { position: relative; flex: 1; min-height: 0; }

    #map { position: absolute; inset: 0; z-index: 1; }

    .leaflet-container { background: var(--sea); font-family: inherit; }

    /* No browser focus outline when a country is clicked */
    .leaflet-interactive:focus { outline: none; }

    /* Pin on the selected country */
    .country-pin { pointer-events: none; }
    .country-pin svg { display: block; filter: drop-shadow(0 2px 3px rgba(0, 0, 0, 0.35)); }

    /* Hover summary tooltip */
    .leaflet-tooltip.country-tip {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
      padding: 9px 12px;
      font-size: 12.5px;
      color: #333;
      min-width: 160px;
    }

    .leaflet-tooltip.country-tip::before { display: none; }
    .tip-name { font-weight: 600; font-size: 13.5px; margin-bottom: 5px; }
    .tip-row { display: flex; align-items: center; gap: 7px; margin-top: 3px; }
    .tip-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
    .tip-cta { margin-top: 7px; font-size: 11px; color: #999; }
    .tip-empty { color: #999; }

    /* Details side panel */
    #panel {
      position: absolute;
      top: 12px;
      right: 12px;
      bottom: 12px;
      width: 380px;
      max-width: calc(100% - 24px);
      z-index: 1100;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 6px 30px rgba(0, 0, 0, 0.16);
      display: flex;
      flex-direction: column;
      transform: translateX(calc(100% + 24px));
      transition: transform 0.25s ease;
    }

    #panel.open { transform: translateX(0); }

    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 18px 12px;
      border-bottom: 1px solid #f0ede8;
      flex-shrink: 0;
    }

    .panel-head h2 { font-size: 18px; font-weight: 600; }

    .panel-close {
      border: none;
      background: #f3f1ee;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      font-size: 18px;
      line-height: 1;
      cursor: pointer;
      color: #555;
    }

    .panel-close:hover { background: #e8e4df; }

    .panel-body {
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
      padding: 12px 18px 20px;
      flex: 1;
    }

    .section { margin-bottom: 18px; }
    .section:last-child { margin-bottom: 0; }

    .section-label {
      display: flex;
      justify-content: space-between;
      font-size: 10.5px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #fff;
      padding: 7px 10px;
      border-radius: 5px;
      margin-bottom: 4px;
    }

    .section-label.trial { background: var(--trial); }
    .section-label.framework { background: var(--framework); }
    .section-label.org { background: var(--org); }

    .item {
      display: flex;
      gap: 10px;
      padding: 10px 2px;
      border-bottom: 1px solid #f3f1ee;
    }

    .item:last-child { border-bottom: none; }
    .item.expired { opacity: 0.55; }
    .item-main { flex: 1; min-width: 0; }

    .item-title {
      font-size: 13.5px;
      line-height: 1.4;
      color: #1a1a1a;
      font-weight: 500;
    }

    a.item-title { text-decoration: none; }
    a.item-title:hover { color: var(--trial); text-decoration: underline; }
    a.item-title .ext { color: #999; font-size: 11px; margin-left: 2px; }

    .item-desc {
      font-size: 11.5px;
      line-height: 1.45;
      color: var(--muted);
      margin-top: 3px;
    }

    .logo-link { flex-shrink: 0; align-self: flex-start; border-radius: 4px; transition: opacity 0.15s; }
    .logo-link:hover { opacity: 0.75; }

    .item img {
      width: 38px;
      height: 38px;
      object-fit: contain;
      border-radius: 4px;
      flex-shrink: 0;
      background: #fff;
    }

    .badge {
      display: inline-block;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.03em;
      padding: 2px 7px;
      border-radius: 10px;
      margin-top: 5px;
      border: 1px solid;
    }

    .badge.active { color: #1f6f5c; border-color: #9fd3c3; background: #eef8f4; }
    .badge.upcoming { color: #8a5a00; border-color: #efcf8a; background: #fff7e6; }
    .badge.expired { color: #666; border-color: #d6d3ce; background: #f3f1ee; }

    .hint {
      position: absolute;
      bottom: 24px;
      right: 12px;
      z-index: 1000;
      background: rgba(255, 255, 255, 0.9);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 11px;
      color: #999;
      border: 1px solid var(--line);
    }

    @media (max-width: 600px) {
      header { padding: 10px 12px; }
      header h1 { font-size: 16px; }
      #controls { bottom: 12px; left: 8px; padding: 8px 10px; gap: 5px; }
      .toggle-btn { padding: 4px 10px; font-size: 11.5px; }
      .hint { display: none; }

      /* Bottom sheet on mobile */
      #panel {
        top: auto;
        left: 0;
        right: 0;
        bottom: 0;
        width: 100%;
        max-width: 100%;
        max-height: 70%;
        border-radius: 14px 14px 0 0;
        transform: translateY(105%);
      }

      #panel.open { transform: translateY(0); }
    }
  </style>
</head>

<body>

  <header>
    <h1>Clinical trials, access frameworks and organisations across Europe</h1>
  </header>

  <div id="stage">
    <div id="map"></div>

    <div id="controls" role="group" aria-label="Filter the map">
      <button class="box-toggle" type="button" aria-expanded="true" aria-controls="box-body" title="Hide filters">
        <span class="label">Categories</span>
        <span class="dots" aria-hidden="true">
          <i data-cat="Clinical Trial" style="background:var(--trial)"></i>
          <i data-cat="Access Framework" style="background:var(--framework)"></i>
          <i data-cat="Organisation" style="background:var(--org)"></i>
        </span>
        <span class="chev" aria-hidden="true"><svg width="10" height="10" viewBox="0 0 10 10"><path d="M2 3.5l3 3 3-3" fill="none" stroke="#555" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      </button>
      <div class="box-body" id="box-body">
      <button class="toggle-btn active" data-cat="Clinical Trial" aria-pressed="true"><span class="dot"></span>Clinical trials</button>
      <button class="toggle-btn active" data-cat="Access Framework" aria-pressed="true"><span class="dot"></span>Access frameworks</button>
      <button class="toggle-btn active" data-cat="Organisation" aria-pressed="true"><span class="dot"></span>Organisations</button>
      <div class="mini-key">
        <span><i style="background:var(--data)"></i>Data</span>
        <span><i style="background:var(--nodata)"></i>No data yet</span>
      </div>
      </div>
    </div>

    <div class="hint">Hover for a summary, click for details</div>

    <aside id="panel" aria-hidden="true" aria-labelledby="panel-title">
      <div class="panel-head">
        <h2 id="panel-title"></h2>
        <button class="panel-close" aria-label="Close">&times;</button>
      </div>
      <div class="panel-body" id="panel-body"></div>
    </aside>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQA1Rp_7zPk_xtjVazNGZXU_oQLtgyTHYXKEm_9dnrcQRzmQ4WzXLhS-06MBXSU6ZDTgFDiK5Xh6dMg/pub?output=csv';
    const GEOJSON_URL = './europe.json';

    const COLOURS = { data: '#6b3fa0', selected: '#2e1650', nodata: '#d4d0ca', land: '#ebe8e3', pin: '#f4efe6' };

    // Country names as written in the Google Sheet -> ISO code in europe.json
    const COUNTRY_ISO = {
      'Albania': 'ALB', 'Andorra': 'AND', 'Austria': 'AUT', 'Belarus': 'BLR',
      'Belgium': 'BEL', 'Bosnia and Herzegovina': 'BIH', 'Bulgaria': 'BGR',
      'Croatia': 'HRV', 'Cyprus': 'CYP', 'Czechia': 'CZE', 'Czech Republic': 'CZE',
      'Denmark': 'DNK', 'Estonia': 'EST', 'Finland': 'FIN', 'France': 'FRA',
      'Germany': 'DEU', 'Greece': 'GRC', 'Hungary': 'HUN', 'Iceland': 'ISL',
      'Ireland': 'IRL', 'Italy': 'ITA', 'Kosovo': 'XKX', 'Latvia': 'LVA',
      'Liechtenstein': 'LIE', 'Lithuania': 'LTU', 'Luxembourg': 'LUX', 'Malta': 'MLT',
      'Moldova': 'MDA', 'Monaco': 'MCO', 'Montenegro': 'MNE', 'Netherlands': 'NLD',
      'North Macedonia': 'MKD', 'Norway': 'NOR', 'Poland': 'POL', 'Portugal': 'PRT',
      'Romania': 'ROU', 'Russia': 'RUS', 'San Marino': 'SMR', 'Serbia': 'SRB',
      'Slovakia': 'SVK', 'Slovenia': 'SVN', 'Spain': 'ESP', 'Sweden': 'SWE',
      'Switzerland': 'CHE', 'Turkey': 'TUR', 'Türkiye': 'TUR', 'Ukraine': 'UKR',
      'UK': 'GBR', 'United Kingdom': 'GBR', 'Vatican': 'VAT'
    };

    // Display name for each ISO code (first sheet spelling wins)
    const ISO_NAME = {};
    Object.entries(COUNTRY_ISO).forEach(([n, iso]) => { if (!ISO_NAME[iso]) ISO_NAME[iso] = n; });

    const CATS = [
      { key: 'Clinical Trial', list: 'trials', label: 'Clinical trials', cls: 'trial', colour: '#2563a8', badgeActive: true },
      { key: 'Access Framework', list: 'frameworks', label: 'Access frameworks', cls: 'framework', colour: '#2d7a3a', badgeActive: true },
      { key: 'Organisation', list: 'orgs', label: 'Organisations', cls: 'org', colour: '#9b3060', badgeActive: false }
    ];

    const active = { 'Clinical Trial': true, 'Access Framework': true, 'Organisation': true };
    let dataByIso = {};
    let geoLayer = null;
    let openIso = null;
    const canHover = window.matchMedia('(hover: hover)').matches;

    const map = L.map('map', {
      center: [54, 15],
      zoom: 4,
      minZoom: 3,
      maxZoom: 8,
      zoomSnap: 0.25,
      maxBounds: [[18, -45], [82, 100]],
      maxBoundsViscosity: 0.8,
      attributionControl: true
    });
    map.attributionControl.setPrefix(false);
    map.attributionControl.addAttribution('Boundaries: <a href="https://www.naturalearthdata.com/" target="_blank" rel="noopener">Natural Earth</a>');

    // ---------- Data ----------

    // Full CSV parser: handles commas, quotes ("") and line breaks inside cells
    function parseCSV(text) {
      const rows = [];
      let row = [], cur = '', inQ = false;
      for (let i = 0; i < text.length; i++) {
        const c = text[i];
        if (inQ) {
          if (c === '"' && text[i + 1] === '"') { cur += '"'; i++; }
          else if (c === '"') inQ = false;
          else cur += c;
        } else if (c === '"') inQ = true;
        else if (c === ',') { row.push(cur); cur = ''; }
        else if (c === '\n' || c === '\r') {
          if (c === '\r' && text[i + 1] === '\n') i++;
          row.push(cur); rows.push(row); row = []; cur = '';
        } else cur += c;
      }
      if (cur !== '' || row.length) { row.push(cur); rows.push(row); }
      const headers = rows.shift().map(h => h.trim());
      return rows
        .filter(r => r.some(v => v.trim() !== ''))
        .map(r => {
          const o = {};
          headers.forEach((h, i) => { o[h] = (r[i] || '').replace(/ /g, ' ').trim(); });
          return o;
        });
    }

    function normaliseStatus(s) {
      const v = (s || '').toLowerCase();
      if (v.startsWith('upcoming')) return 'upcoming';
      if (v.startsWith('expired') || v.includes('archived')) return 'expired';
      return 'active';
    }

    const STATUS_LABEL = { active: 'Active', upcoming: 'Upcoming', expired: 'Expired / archived' };
    const STATUS_ORDER = { active: 0, upcoming: 1, expired: 2 };

    function buildCountryData(rows) {
      const d = {};
      const unknown = new Set();
      rows.forEach(row => {
        const country = row['Country'];
        if (!country) return;
        const iso = COUNTRY_ISO[country];
        if (!iso) { unknown.add(country); return; }
        if (!d[iso]) d[iso] = { name: country, trials: [], frameworks: [], orgs: [] };
        const cat = CATS.find(c => c.key === row['Category']);
        if (!cat) return;
        d[iso][cat.list].push({
          title: row['Title'] || '',
          description: row['Description'] || '',
          url: row['URL'] || '',
          image: pickLogo(row, cat.key),
          logoLink: pickLogoLink(row, cat.key),
          status: normaliseStatus(row['Status'])
        });
      });
      // Active first, then upcoming, then expired; original sheet order kept within each
      Object.values(d).forEach(cd => CATS.forEach(c =>
        cd[c.list] = cd[c.list].map((e, i) => [e, i])
          .sort((a, b) => STATUS_ORDER[a[0].status] - STATUS_ORDER[b[0].status] || a[1] - b[1])
          .map(x => x[0])));
      if (unknown.size) console.warn('Countries in the sheet not recognised by the map:', [...unknown]);
      return d;
    }

    function visibleCats(cd) {
      return cd ? CATS.filter(c => active[c.key] && cd[c.list].length > 0) : [];
    }

    // ---------- Rendering helpers ----------

    function esc(s) {
      return String(s).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
    }

    // ---------- Logos ----------
    // Order of preference:
    //   1. Image column (a ./images/... file or any full image URL) always wins
    //   2. Sponsor website column: the logo is fetched automatically from that site
    //   3. Organisations only: the logo is fetched from the organisation's own URL
    const USE_ORG_URL_FOR_LOGO = true;
    const LOGO_SERVICE = domain => 'https://www.google.com/s2/favicons?sz=128&domain=' + encodeURIComponent(domain);

    function domainOf(u) {
      if (!u) return '';
      try {
        return new URL(/^https?:\/\//i.test(u) ? u : 'https://' + u).hostname.replace(/^www\./, '');
      } catch (e) { return ''; }
    }

    // Where clicking the logo goes: the sponsor's website, or for organisations their own URL
    function pickLogoLink(row, catKey) {
      const site = (row['Sponsor website'] || row['Sponsor Website'] || row['Logo website'] || '').trim();
      if (site) return /^https?:\/\//i.test(site) ? site : 'https://' + site;
      return catKey === 'Organisation' ? (row['URL'] || '') : '';
    }

    function pickLogo(row, catKey) {
      if (row['Image']) return row['Image'];
      const site = row['Sponsor website'] || row['Sponsor Website'] || row['Logo website'] || '';
      let domain = domainOf(site);
      if (!domain && USE_ORG_URL_FOR_LOGO && catKey === 'Organisation') domain = domainOf(row['URL']);
      return domain ? LOGO_SERVICE(domain) : '';
    }

    function safeUrl(u) {
      return /^(https?:\/\/|\.\/|\/)/i.test(u) ? u : '';
    }

    function tooltipHtml(iso) {
      const cd = dataByIso[iso];
      const name = cd ? cd.name : (ISO_NAME[iso] || '');
      let html = '<div class="tip-name">' + esc(name) + '</div>';
      const cats = visibleCats(cd);
      if (!cats.length) return html + '<div class="tip-empty">No data yet</div>';
      cats.forEach(c => {
        const items = cd[c.list];
        const n = items.length;
        const exp = items.filter(e => e.status === 'expired').length;
        const up = items.filter(e => e.status === 'upcoming').length;
        const extras = [up ? up + ' upcoming' : '', exp ? exp + ' expired' : ''].filter(Boolean).join(', ');
        html += '<div class="tip-row"><span class="tip-dot" style="background:' + c.colour + '"></span>' +
          n + ' ' + (n === 1 ? c.label.replace(/s$/, '').toLowerCase() : c.label.toLowerCase()) +
          (extras ? ' <span style="color:#999">(' + extras + ')</span>' : '') + '</div>';
      });
      return html + '<div class="tip-cta">Click for details</div>';
    }

    function itemHtml(e, cat) {
      const url = safeUrl(e.url);
      const img = safeUrl(e.image);
      let html = '<div class="item' + (e.status === 'expired' ? ' expired' : '') + '">';
      html += '<div class="item-main">';
      if (url) {
        html += '<a class="item-title" href="' + esc(url) + '" target="_blank" rel="noopener">' +
          esc(e.title || 'View details') + '<span class="ext" aria-hidden="true">&#8599;</span></a>';
      } else {
        html += '<div class="item-title">' + esc(e.title) + '</div>';
      }
      if (e.description) html += '<div class="item-desc">' + esc(e.description) + '</div>';
      if (e.status !== 'active' || cat.badgeActive) {
        html += '<span class="badge ' + e.status + '">' + STATUS_LABEL[e.status] + '</span>';
      }
      html += '</div>';
      if (img) {
        // If the logo fails to load, remove it (and its link) entirely
        const drop = "(this.closest('.logo-link') || this).remove()";
        const imgTag = '<img src="' + esc(img) + '" alt="" loading="lazy" onerror="' + drop + '" onload="if (this.naturalWidth < 24) ' + drop + '">';
        const link = /^https?:\/\//i.test(e.logoLink) ? e.logoLink : '';
        html += link
          ? '<a class="logo-link" href="' + esc(link) + '" target="_blank" rel="noopener" title="Visit sponsor website" aria-label="Visit sponsor website">' + imgTag + '</a>'
          : imgTag;
      }
      html += '</div>';
      return html;
    }

    // ---------- Panel ----------

    const panel = document.getElementById('panel');
    const panelTitle = document.getElementById('panel-title');
    const panelBody = document.getElementById('panel-body');

    // Beige map pin placed on the selected country
    const PIN_ICON = L.divIcon({
      className: 'country-pin',
      iconSize: [26, 36],
      iconAnchor: [13, 35],
      html: '<svg width="26" height="36" viewBox="0 0 26 36" aria-hidden="true">' +
        '<path d="M13 1C6.4 1 1 6.3 1 12.9 1 21.8 13 35 13 35s12-13.2 12-22.1C25 6.3 19.6 1 13 1z" fill="' + COLOURS.pin + '" stroke="#2e1650" stroke-width="1.5"/>' +
        '<circle cx="13" cy="12.8" r="4.3" fill="#2e1650"/></svg>'
    });
    let pinMarker = null;
    const pinByIso = {};

    function placePin(iso) {
      const ll = pinByIso[iso];
      if (!ll) { removePin(); return; }
      if (!pinMarker) pinMarker = L.marker(ll, { icon: PIN_ICON, interactive: false, keyboard: false }).addTo(map);
      else pinMarker.setLatLng(ll);
    }

    function removePin() {
      if (pinMarker) { map.removeLayer(pinMarker); pinMarker = null; }
    }

    function openPanel(iso) {
      const cd = dataByIso[iso];
      const cats = visibleCats(cd);
      if (!cats.length) { closePanel(); return; }
      openIso = iso;
      panelTitle.textContent = cd.name;
      panelBody.innerHTML = cats.map(c =>
        '<div class="section"><div class="section-label ' + c.cls + '"><span>' + c.label + '</span><span>' +
        cd[c.list].length + '</span></div>' + cd[c.list].map(e => itemHtml(e, c)).join('') + '</div>'
      ).join('');
      panelBody.scrollTop = 0;
      placePin(iso);
      panel.classList.add('open');
      panel.setAttribute('aria-hidden', 'false');
      refreshMap();
    }

    function closePanel() {
      openIso = null;
      removePin();
      panel.classList.remove('open');
      panel.setAttribute('aria-hidden', 'true');
      refreshMap();
    }

    document.querySelector('.panel-close').addEventListener('click', closePanel);
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closePanel(); });
    // Stop scrolling/clicks in the panel from moving the map
    L.DomEvent.disableScrollPropagation(panel);
    L.DomEvent.disableClickPropagation(document.getElementById('controls'));

    // Collapse / expand the filter box (open on load)
    const controls = document.getElementById('controls');
    const boxToggle = controls.querySelector('.box-toggle');
    boxToggle.addEventListener('click', () => {
      const collapsed = controls.classList.toggle('collapsed');
      boxToggle.setAttribute('aria-expanded', !collapsed);
      boxToggle.title = collapsed ? 'Show filters' : 'Hide filters';
    });

    function syncFilterDots() {
      controls.querySelectorAll('.dots i').forEach(d => d.classList.toggle('off', !active[d.dataset.cat]));
    }
    L.DomEvent.disableClickPropagation(panel);

    // ---------- Map styling ----------

    function styleFeature(feature) {
      const p = feature.properties;
      if (!p.europe) {
        return { fillColor: COLOURS.land, fillOpacity: 1, weight: 0.6, color: '#fff', opacity: 1, interactive: false };
      }
      const has = visibleCats(dataByIso[p.ISO_A3]).length > 0;
      const selected = openIso === p.ISO_A3;
      return {
        fillColor: selected ? COLOURS.selected : (has ? COLOURS.data : COLOURS.nodata),
        fillOpacity: selected ? 1 : (has ? 0.75 : 0.8),
        weight: 1,
        color: '#fff',
        opacity: 1
      };
    }

    function onEachFeature(feature, layer) {
      const p = feature.properties;
      if (!p.europe) return;
      const iso = p.ISO_A3;
      if (p.pin) pinByIso[iso] = p.pin;

      if (canHover) {
        layer.bindTooltip(() => tooltipHtml(iso), { sticky: true, direction: 'auto', className: 'country-tip', offset: [14, 0] });
      }

      layer.on({
        mouseover: function () {
          if (visibleCats(dataByIso[iso]).length) {
            if (openIso !== iso) this.setStyle({ fillOpacity: 0.95 });
            this.bringToFront();
          }
        },
        mouseout: function () { this.setStyle(styleFeature(feature)); },
        click: function () {
          if (visibleCats(dataByIso[iso]).length) { this.closeTooltip && this.closeTooltip(); openPanel(iso); }
          else closePanel();
        }
      });
    }

    function refreshMap() {
      if (geoLayer) geoLayer.setStyle(styleFeature);
    }

    map.on('click', e => { if (!e.originalEvent.defaultPrevented && e.originalEvent.target === map.getContainer()) closePanel(); });

    document.querySelectorAll('.toggle-btn').forEach(btn => {
      btn.addEventListener('click', function () {
        const cat = this.dataset.cat;
        active[cat] = !active[cat];
        this.classList.toggle('active', active[cat]);
        this.setAttribute('aria-pressed', active[cat]);
        syncFilterDots();
        refreshMap();
        if (openIso) openPanel(openIso); // re-render or close if nothing left
      });
    });

    // ---------- Load ----------

    async function loadData() {
      try {
        const csvRes = await fetch(CSV_URL);
        dataByIso = buildCountryData(parseCSV(await csvRes.text()));
      } catch (e) {
        console.warn('Could not load live data, map will show geography only.', e);
      }

      try {
        const geoData = await (await fetch(GEOJSON_URL)).json();
        geoLayer = L.geoJSON(geoData, { style: styleFeature, onEachFeature }).addTo(map);
        // Frame mainland Europe plus Iceland, Cyprus and Turkey
        map.fitBounds([[34, -24], [70, 40]], { padding: [10, 10] });
      } catch (e) {
        console.error('Could not load map geography.', e);
      }
    }

    loadData();
  </script>
</body>

</html>
